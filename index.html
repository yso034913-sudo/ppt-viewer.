<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a2e1d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>عروضي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3ece8;--sf:#fff;--ink:#2a1a14;--mu:#7a6a62;--ln:#e0d0c8;--ac:#c2410c;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a110e;--sf:#2a1c17;--ink:#f3e6df;--mu:#b39d92;--ln:#43302a;--ac:#f08a5d;--on:#1a0d07}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Cairo,system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
header.top{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
header.top h1{flex:1;margin:0;font-size:24px;font-weight:800}
.btn{background:var(--ac);color:var(--on);padding:8px 16px;border-radius:10px;font-weight:600}
.ghost{padding:8px 12px;border-radius:10px;background:var(--sf);border:1px solid var(--ln)}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:12px 16px 90px}
.fo{position:relative;background:var(--c);color:#fff;border-radius:6px 16px 16px 16px;padding:38px 14px 14px;min-height:120px;text-align:start;display:flex;flex-direction:column;justify-content:flex-end}
.fo::before{content:"";position:absolute;top:-8px;inset-inline-start:0;width:46%;height:14px;background:var(--c);border-radius:8px 8px 0 0}
.fo b{font-size:17px;word-break:break-word}.fo small{opacity:.85}
.fo .mb{position:absolute;top:6px;inset-inline-end:2px;width:36px;height:36px;display:grid;place-items:center}
.list{padding:6px 16px 90px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:6px 6px 6px 10px}
.row .main{flex:1;text-align:start;padding:8px;min-width:0}
.row .main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mu)}
.tag{width:42px;height:44px;border-radius:6px;background:var(--ln);display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.tag.ppt{background:#d24726}.tag.aud{background:#7b5ce0}.tag.vid{background:#1f6f8b}
.empty{margin:60px 24px;text-align:center;color:var(--mu)}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px #0005;padding:12px 20px;border-radius:14px}
.mod{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mod .box{background:var(--sf);width:min(100%,460px);max-height:80%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.mod input{padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg)}
.mod .it{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;text-align:start;width:100%;background:var(--bg)}
.mod .it.dg{color:#e5383b}.mod .it i{width:18px;height:18px;border-radius:50%}
.mod .two{display:flex;gap:8px}.mod .two button{flex:1}
#toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#2a1a14;color:#fff;padding:10px 16px;border-radius:12px;z-index:60}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* viewer */
#reader{position:fixed;inset:0;background:#0b0807;z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#stage{flex:1;position:relative;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;z-index:5;background:#0b0807}
.sl{position:absolute;left:50%;top:50%;transform-origin:center;overflow:hidden;background:#fff}
.sl .in{position:absolute;inset:0;overflow:hidden}
.sh{position:absolute;box-sizing:border-box}
.sh img{-webkit-user-drag:none}
.mi{position:absolute;inset:0;margin:auto;width:min(70%,56px);height:min(70%,56px);border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;font-size:18px;z-index:3}
.ph{display:grid;place-items:center;border:2px dashed #999;color:#777;font:14px sans-serif;text-align:center}
#bar{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:#1c1310;color:#fff;flex-wrap:wrap}
#bar button{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff}
#bar button.on{background:var(--ac);color:var(--on)}
#bar .pn{min-width:70px;text-align:center;font-size:14px;direction:ltr}
.one{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
.one audio{width:min(100%,520px)}.one video{max-width:100%;max-height:100%}
</style>
</head>
<body>
<div id="app"></div>
<div id="reader" hidden>
  <div id="stage"><div id="loading">جارٍ فتح الملف…</div></div>
  <div id="bar"></div>
</div>
<div id="toast" hidden></div>
<input type="file" id="pick" multiple hidden accept=".pptx,.ppsx,.potx,.pptm,.ppsm,.ppt,.pps,audio/*,video/*">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const IC={more:'M12 5h.01M12 12h.01M12 19h.01',back:'M9 5l7 7-7 7',prev:'M9 5l7 7-7 7',next:'M15 5l-7 7 7 7',snd:'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.500 6.500a8 8 0 0 1 0 11',auto:'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z',notes:'M5 4h14v12H9l-4 4z',full:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',x:'M6 6l12 12M18 6L6 18'};
const ico=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const FCOLS=['#d24726','#d68910','#2a9d5b','#1f6f8b','#7b5ce0','#5b6b7a'];

/* ---------- storage ---------- */
let db;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('pptapp',1);r.onupgradeneeded=()=>{r.result.createObjectStore('folders',{keyPath:'id'});r.result.createObjectStore('docs',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
let F=[],Dc=[],cf=null;
const load=async()=>{F=(await all('folders')).sort((a,b)=>a.o-b.o);Dc=await all('docs')};

/* ---------- ui helpers ---------- */
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)};
function modal(html){const m=el('div','mod');const b=el('div','box',html);m.append(b);m.onclick=e=>{if(e.target==m)m.remove()};document.body.append(m);return{m,b}}
function sheet(title,items){const {m,b}=modal(`<b>${esc(title)}</b>`);items.forEach(i=>{const x=el('button','it'+(i.dg?' dg':''),(i.c?`<i style="background:${i.c}"></i>`:'')+esc(i.l));x.onclick=()=>{m.remove();i.f()};b.append(x)})}
function ask(title,val='',ok='حفظ'){return new Promise(r=>{const {m,b}=modal(`<b>${esc(title)}</b><input><div class="two"><button class="ghost">إلغاء</button><button class="btn">${ok}</button></div>`);const i=b.querySelector('input');i.value=val;setTimeout(()=>i.focus(),50);const [c,o]=b.querySelectorAll('button');const done=v=>{m.remove();r(v)};c.onclick=()=>done(null);o.onclick=()=>done(i.value.trim());i.onkeydown=e=>{if(e.key=='Enter')done(i.value.trim())}})}
const size=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const kind=n=>/\.(pptx|ppsx|potx|pptm|ppsm|potm)$/i.test(n)?'ppt':/\.(mp3|m4a|wav|ogg|aac|flac|opus)$/i.test(n)?'aud':/\.(mp4|webm|mov|m4v)$/i.test(n)?'vid':null;
const TAG={ppt:'PPT',aud:'صوت',vid:'فيديو'};

/* ---------- home ---------- */
function render(){
  const a=$('#app');a.innerHTML='';
  if(!cf){
    const h=el('header','top','<h1>عروضي</h1>');const nb=el('button','btn','+ مجلد جديد');nb.onclick=newFolder;h.append(nb);a.append(h);
    if(!F.length){a.append(el('div','empty','<p>لا توجد مجلدات بعد.<br>أنشئ مجلداً ثم أضف إليه عروض PowerPoint أو ملفات صوت وفيديو.</p>'));return}
    const g=el('div','grid');
    F.forEach(f=>{const n=Dc.filter(d=>d.folder==f.id).length;const t=el('button','fo',`<b>${esc(f.name)}</b><small>${n} ملف</small>`);t.style.setProperty('--c',f.color);t.onclick=()=>{cf=f.id;render()};
      const mb=el('span','mb',ico('more'));mb.onclick=e=>{e.stopPropagation();folderMenu(f)};t.append(mb);g.append(t)});
    a.append(g);
  }else{
    const f=F.find(x=>x.id==cf);const h=el('header','top');const bk=el('button','ib ghost',ico('back'));bk.onclick=()=>{cf=null;render()};
    h.append(bk,el('h1','',esc(f.name)));a.append(h);
    const ds=Dc.filter(d=>d.folder==cf).sort((x,y)=>y.t-x.t);
    if(!ds.length)a.append(el('div','empty','<p>المجلد فارغ.<br>اضغط «إضافة ملفات».</p>'));
    const l=el('div','list');
    ds.forEach(d=>{const r=el('div','row',`<div class="tag ${d.type}">${TAG[d.type]}</div>`);
      const m=el('button','main',`<b>${esc(d.name)}</b><small>${size(d.size)}</small>`);m.onclick=()=>openDoc(d);
      const mb=el('button','ib',ico('more'));mb.onclick=()=>docMenu(d);r.append(m,mb);l.append(r)});
    a.append(l);
    const fb=el('button','btn fab','إضافة ملفات');fb.onclick=()=>$('#pick').click();a.append(fb);
  }
}
async function newFolder(){const n=await ask('اسم المجلد','','إنشاء');if(!n)return;await put('folders',{id:uid(),name:n,color:FCOLS[F.length%FCOLS.length],o:Date.now()});await load();render()}
function folderMenu(f){sheet(f.name,[
  {l:'تغيير الاسم',f:async()=>{const n=await ask('اسم المجلد',f.name);if(n){f.name=n;await put('folders',f);await load();render()}}},
  {l:'تغيير اللون',f:()=>sheet('اللون',FCOLS.map(c=>({l:'',c,f:async()=>{f.color=c;await put('folders',f);await load();render()}})))},
  {l:'حذف المجلد وكل ملفاته',dg:1,f:()=>sheet('تأكيد الحذف؟',[{l:'نعم، احذف',dg:1,f:async()=>{for(const d of Dc.filter(d=>d.folder==f.id))await del('docs',d.id);await del('folders',f.id);await load();render()}},{l:'إلغاء',f:()=>{}}])}])}
function docMenu(d){sheet(d.name,[
  {l:'تغيير الاسم',f:async()=>{const n=await ask('اسم الملف',d.name);if(n){d.name=n;await put('docs',d);await load();render()}}},
  {l:'نقل إلى مجلد آخر',f:()=>sheet('انقل إلى',F.filter(f=>f.id!=d.folder).map(f=>({l:f.name,c:f.color,f:async()=>{d.folder=f.id;await put('docs',d);await load();render()}})))},
  {l:'مشاركة / تصدير',f:async()=>{const f=new File([d.blob],d.name,{type:d.blob.type});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else toast('المشاركة غير متاحة')}catch(e){}}},
  {l:'حذف',dg:1,f:()=>sheet('تأكيد الحذف؟',[{l:'نعم، احذف',dg:1,f:async()=>{await del('docs',d.id);await load();render()}},{l:'إلغاء',f:()=>{}}])}])}
$('#pick').onchange=async e=>{let n=0;
  for(const f of e.target.files){const k=kind(f.name);
    if(!k){toast(/\.(ppt|pps)$/i.test(f.name)?'صيغة .ppt القديمة غير مدعومة، احفظه كـ .pptx':'نوع غير مدعوم: '+f.name);continue}
    await put('docs',{id:uid(),folder:cf,name:f.name,type:k,blob:f,size:f.size,t:Date.now()});n++}
  e.target.value='';await load();render();if(n)toast('تمت إضافة '+n+' ملف')};

/* ---------- OOXML helpers ---------- */
const NR='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const X=s=>new DOMParser().parseFromString(s,'application/xml');
const D=(n,k)=>n?[...n.getElementsByTagNameNS('*',k)]:[];
const ch=(n,k)=>n?[...n.children].filter(c=>c.localName==k):[];
const c1=(n,k)=>n?[...n.children].find(c=>c.localName==k):null;
const path=(n,...ks)=>ks.reduce((a,k)=>c1(a,k),n);
const at=(n,a,d)=>{const v=n&&n.getAttribute&&n.getAttribute(a);return v==null?d:v};
const px=v=>v/9525;
const dirn=p=>p.replace(/[^/]*$/,'');
const norm=p=>{const o=[];p.split('/').forEach(s=>{if(s=='..')o.pop();else if(s&&s!='.')o.push(s)});return o.join('/')};
const MI={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',svg:'image/svg+xml',webp:'image/webp',bmp:'image/bmp',mp3:'audio/mpeg',m4a:'audio/mp4',wav:'audio/wav',ogg:'audio/ogg',aac:'audio/aac',mp4:'video/mp4',m4v:'video/mp4',mov:'video/mp4',webm:'video/webm'};
let Z,PRES,THEME={},FONTS={},CMAP={},SW=9144000,SH=6858000,parts={},cache={};
async function part(p){
  if(parts[p])return parts[p];const f=Z.file(p);if(!f)return null;
  const doc=X(await f.async('string')),rf=Z.file(dirn(p)+'_rels/'+p.split('/').pop()+'.rels'),rels={};
  if(rf)D(X(await rf.async('string')),'Relationship').forEach(r=>{const t=r.getAttribute('Target');rels[r.getAttribute('Id')]={t:r.getAttribute('TargetMode')=='External'?null:(t[0]=='/'?t.slice(1):norm(dirn(p)+t)),ty:r.getAttribute('Type').split('/').pop()}});
  return parts[p]={p,doc,rels};
}
async function url(p){if(cache[p])return cache[p];const f=Z.file(p);if(!f)return '';const b=await f.async('blob');return cache[p]=URL.createObjectURL(new Blob([b],{type:MI[p.split('.').pop().toLowerCase()]||''}))}
/* WMA: المتصفح لا يشغّله، فنحوّله على الجهاز عند أول تشغيل بـ ffmpeg.wasm */
const loadJs=u=>new Promise((r,j)=>{const e=document.createElement('script');e.src=u;e.onload=r;e.onerror=j;document.head.append(e)});
const blobU=async(u,t)=>URL.createObjectURL(new Blob([await(await fetch(u)).arrayBuffer()],{type:t}));
const FFB='https://cdn.jsdelivr.net/npm/@ffmpeg/';let FFP=null,FQ=Promise.resolve(),FN=0,STG='';
function ffLoad(){return FFP||(FFP=(async()=>{
  STG='1 تحميل المكتبة';await loadJs(FFB+'ffmpeg@0.12.10/dist/umd/ffmpeg.js');STG='2 تحميل ملفات المحوّل';
  const cw=await blobU(FFB+'ffmpeg@0.12.10/dist/umd/814.ffmpeg.js','text/javascript');let last;
  for(const t of ['esm','umd']){try{
    const cu=await blobU(FFB+'core@0.12.6/dist/'+t+'/ffmpeg-core.js','text/javascript'),wu=await blobU(FFB+'core@0.12.6/dist/'+t+'/ffmpeg-core.wasm','application/wasm');
    STG='3 تشغيل المحوّل ('+t+')';const ff=new FFmpegWASM.FFmpeg();await ff.load({classWorkerURL:cw,coreURL:cu,wasmURL:wu});return ff}catch(e){last=e}}
  throw last})().catch(e=>{FFP=null;throw e}))}
function convWma(p){
  const k=p+'.wav';if(cache[k])return Promise.resolve(cache[k]);
  const job=FQ.then(async()=>{if(cache[k])return cache[k];const ff=await ffLoad(),i='i'+(++FN)+'.wma',o='o'+FN+'.wav';
    STG='4 تحويل الصوت';await ff.writeFile(i,await Z.file(p).async('uint8array'));
    if(await ff.exec(['-i',i,'-vn','-ac','1','-ar','22050','-f','wav',o]))throw new Error('ffmpeg failed');
    const b=await ff.readFile(o);await ff.deleteFile(i);await ff.deleteFile(o);
    return cache[k]=URL.createObjectURL(new Blob([b.buffer],{type:'audio/wav'}))});
  FQ=job.catch(()=>{});return job}
const relOf=(pt,ty)=>pt&&Object.values(pt.rels).find(r=>r.ty==ty);

/* colors */
function hsl(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2;let h=0,s=0;if(M!=m){const d=M-m;s=l>.5?d/(2-M-m):d/(M+m);h=M==r?(g-b)/d+(g<b?6:0):M==g?(b-r)/d+2:(r-g)/d+4;h/=6}return[h,s,l]}
function rgb(h,s,l){if(!s)return[l*255,l*255,l*255];const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q,f=t=>{t=(t+1)%1;return 255*(t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p)};return[f(h+1/3),f(h),f(h-1/3)]}
const CK=['srgbClr','schemeClr','sysClr','prstClr'];
function clr(n){
  if(!n)return null;const c=CK.includes(n.localName)?n:[...n.children].find(x=>CK.includes(x.localName));if(!c)return null;
  let h;const k=c.localName,v0=c.getAttribute('val');
  if(k=='srgbClr')h=v0;else if(k=='sysClr')h=c.getAttribute('lastClr')||'000000';else if(k=='prstClr')h=({black:'000000',white:'ffffff'})[v0]||'808080';
  else h=THEME[CMAP[v0]||v0]||'000000';
  let [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)),a=1;
  for(const m of c.children){const v=+m.getAttribute('val')/1e5,q=m.localName;
    if(q=='alpha')a=v;else if(q=='lumMod'||q=='lumOff'){let [H,S,L]=hsl(r,g,b);L=q=='lumMod'?L*v:L+v;[r,g,b]=rgb(H,S,Math.max(0,Math.min(1,L)))}
    else if(q=='tint')[r,g,b]=[r,g,b].map(x=>x+(255-x)*(1-v));else if(q=='shade')[r,g,b]=[r,g,b].map(x=>x*v)}
  return `rgba(${r|0},${g|0},${b|0},${a})`;
}
const tx1=()=>clr({localName:'schemeClr',getAttribute:()=>'tx1',children:[]})||'#000';
async function fill(pr,pt){
  if(!pr)return null;
  for(const c of pr.children){const k=c.localName;
    if(k=='noFill')return 'transparent';
    if(k=='solidFill')return clr(c);
    if(k=='gradFill'){const st=D(c,'gs').map(g=>`${clr(g)} ${+g.getAttribute('pos')/1000}%`),ln=D(c,'lin')[0];return st.length?`linear-gradient(${ln?+ln.getAttribute('ang')/60000+90:180}deg,${st.join(',')})`:null}
    if(k=='blipFill'){const b=D(c,'blip')[0],r=b&&pt.rels[b.getAttributeNS(NR,'embed')];if(r&&r.t)return `url(${await url(r.t)}) center/100% 100% no-repeat`}}
  return null;
}

/* ---------- text ---------- */
const lv=(chain,l)=>chain.map(s=>s&&c1(s,'lvl'+(l+1)+'pPr')).filter(Boolean);
const WD={'§':'▪','Ø':'➢','ü':'✓','q':'❑','·':'•','o':'○','v':'❖','Ï':'•'};

    b('auto',()=>{auto=!auto;if(!auto)clearTimeout(tmr);toast(auto?'التشغيل التلقائي والتوقيت: مفعّل':'التشغيل التلقائي والتوقيت: متوقف');upd()},'t-auto');
    b('notes',()=>{const n=SL[cur]&&SL[cur].notes;if(!n)return toast('لا توجد ملاحظات');const {b}=modal('<b>ملاحظات المتحدث</b>');b.append(el('div','',esc(n).replace(/\n/g,'<br>')))});
    b('full',()=>{document.fullscreenElement?document.exitFullscreen():(R_.requestFullscreen?R_.requestFullscreen().catch(()=>toast('ملء الشاشة غير متاح')):toast('ملء الشاشة غير متاح'))});
  }
  b('x',closeDoc);
}
async function openDoc(d){
  R_.hidden=false;$('#loading').hidden=false;stage.querySelectorAll('.sl,.one').forEach(e=>e.remove());
  S=[];SL=[];cur=-1;keepers=[];tok++;isDeck=d.type=='ppt';buildBar(isDeck);
  try{
    if(isDeck){
      await initDeck(d.blob);if(!S.length)throw 0;$('#loading').hidden=true;await go(0);
    }else{
      const m=document.createElement(d.type=='aud'?'audio':'video'),w=el('div','one');m.src=URL.createObjectURL(d.blob);m.controls=true;m.autoplay=true;m.playsInline=true;w.append(m);stage.append(w);$('#loading').hidden=true;
    }
  }catch(e){console.error(e);toast('تعذّر فتح الملف');closeDoc()}
}
function closeDoc(){
  clearTimeout(tmr);tok++;
  stage.querySelectorAll('audio,video').forEach(m=>{m.pause();m.removeAttribute('src')});
  stage.querySelectorAll('.sl,.one').forEach(e=>e.remove());
  Object.values(cache).forEach(u=>URL.revokeObjectURL(u));cache={};SL=[];S=[];cur=-1;keepers=[];
  if(document.fullscreenElement)document.exitFullscreen();
  R_.hidden=true;
}
/* gestures */
let sx=0,sy=0,sw=false;
stage.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;sw=false};
stage.onpointerup=e=>{if(!isDeck)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){sw=true;go(dx<0?cur+1:cur-1)}};
stage.onclick=e=>{if(!isDeck||sw||e.target.closest('.mi,video'))return;go(cur+1)};
addEventListener('keydown',e=>{if(R_.hidden||!isDeck)return;
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key))go(cur+1);
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))go(cur-1);
  else if(e.key=='Escape'&&!document.fullscreenElement)closeDoc()});
/* init */
openDB().then(load).then(render).catch(()=>{$('#app').innerHTML='<div class="empty"><p>تعذّر الوصول إلى التخزين. افتح التطبيق خارج وضع التصفح الخفي.</p></div>'});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
